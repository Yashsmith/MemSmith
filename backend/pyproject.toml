[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memsmith"
version = "0.1.0"
description = "Zero-infra shared state for multi-agent AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yashsmith Shah" }]
dependencies = [
  "msgspec>=0.19.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.35.0",
  "uvloop>=0.21.0; sys_platform != 'win32'",
]
llm = [
  "litellm>=1.74.0",
]
watch = [
  "rich>=14.0.0",
  "textual>=1.0.0",
]
dev = [
  "mypy>=1.16.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.0",
]

[project.scripts]
memsmith = "memsmith.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
